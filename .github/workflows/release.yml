name: release

# Push a tag like v1.0.0 to build Windows, macOS and Linux and publish them
# as a GitHub Release. The macOS app is not signed (see README).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - if: matrix.name == 'windows'
        shell: bash
        run: |
          wails build -ldflags "-s -w -X main.Version=${{ github.ref_name }}"
          mkdir dist && cp build/bin/work-dashboard.exe dist/work-dashboard-windows-amd64.exe
      - if: matrix.name == 'macos'
        run: |
          wails build -platform darwin/universal -ldflags "-s -w -X main.Version=${{ github.ref_name }}"
          mkdir dist && ditto -c -k --keepParent build/bin/work-dashboard.app dist/work-dashboard-macos-universal.zip
      - if: matrix.name == 'linux'
        run: |
          wails build -tags webkit2_41 -ldflags "-s -w -X main.Version=${{ github.ref_name }}"
          mkdir dist && tar -czf dist/work-dashboard-linux-amd64.tar.gz -C build/bin work-dashboard

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
