<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>work-dashboard</title>
</head>
<body>
  <div id="app">
    <section class="panel side" aria-label="워크스페이스와 파일">
      <div class="side-top">
        <h2>Workspaces</h2>
        <div id="ws-list"></div>
        <div id="ws-editor"></div>
      </div>
      <div class="side-bottom">
        <h2>Files</h2>
        <div id="file-tree" class="file-tree"></div>
      </div>
    </section>
    <div class="gutter gutter-col" data-split="side" style="grid-area: gl"></div>
    <section class="panel floor" aria-label="사무실">
      <canvas id="floor"></canvas>
    </section>
    <div class="gutter gutter-row" data-split="floor" style="grid-area: gh"></div>
    <section class="panel terminal" aria-label="터미널과 파일">
      <header class="term-bar">
        <div id="editor-tabs" class="term-tabs" role="tablist"></div>
        <div class="term-actions">
          <button type="button" class="ghost" data-open="claude">+ Claude</button>
          <button type="button" class="ghost" data-open="shell">+ 셸</button>
        </div>
      </header>
      <div id="editor-body" class="term-body">
        <p id="editor-empty" class="muted editor-empty">워크스페이스를 고르고 + Claude 나 + 셸 로 터미널을 열거나, 왼쪽에서 파일을 여세요.</p>
      </div>
    </section>
    <div class="gutter gutter-col" data-split="widgets" style="grid-area: gr"></div>
    <section class="panel widgets" aria-label="위젯" id="widget-board"></section>
  </div>
  <div id="toast" role="status"></div>
  <script src="./src/main.ts" type="module"></script>
</body>
</html>
